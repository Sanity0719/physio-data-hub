# Gradle daemon JVM options.
# 本机需走代理才能下载依赖（Java 不读 HTTP_PROXY，故写成 JVM 系统参数）。
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -Dhttp.proxyHost=127.0.0.1 -Dhttp.proxyPort=7897 -Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7897 -Dhttp.nonProxyHosts=localhost|127.0.0.1
# Kotlin 编译进程单独给内存，避免和 Gradle 抢
kotlin.daemon.jvmargs=-Xmx2048m
# Kotlin 编译改为进程内执行，避免独立编译进程再占一份内存。
kotlin.compiler.execution.strategy=in-process
# 使用 AndroidX（新工程一律是 true）
android.useAndroidX=true
# Kotlin 代码风格
kotlin.code.style=official
